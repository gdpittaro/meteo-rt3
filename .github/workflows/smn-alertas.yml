name: Alertas SMN - METEO RT3

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  alertas:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Consultar alertas oficiales del SMN
        env:
          NTFY_TOPIC: meteo-rt3-alertas-7k9p2x
        run: |
          python3 <<'PY'
          import os
          import re
          import json
          import urllib.request
          import urllib.parse
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone

          LAT = -32.17301
          LON = -64.11405
          TOPIC = os.environ["NTFY_TOPIC"]

          INDEX = "https://ssl.smn.gob.ar/CAP/AR.php"
          STATE_FILE = ".github/smn-seen.json"

          def get(url):
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "METEO-RT3/1.0"}
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read()

          def tag(root, name):
              for e in root.iter():
                  if e.tag.split("}")[-1] == name:
                      return e.text or ""
              return ""

          def all_tags(root, name):
              return [
                  e.text or ""
                  for e in root.iter()
                  if e.tag.split("}")[-1] == name
              ]

          def inside_polygon(lat, lon, points):
              inside = False
              j = len(points) - 1

              for i in range(len(points)):
                  yi, xi = points[i]
                  yj, xj = points[j]

                  if ((xi > lon) != (xj > lon)):
                      y_cross = (yj - yi) * (lon - xi) / (xj - xi) + yi
                      if lat < y_cross:
                          inside = not inside

                  j = i

              return inside

          def parse_time(value):
              if not value:
                  return None
              try:
                  return datetime.fromisoformat(value.replace("Z", "+00:00"))
              except:
                  return None

          # Descargar índice CAP oficial
          html = get(INDEX).decode("utf-8", errors="ignore")

          links = re.findall(
              r'href=["\']([^"\']+\.xml)["\']',
              html,
              flags=re.I
          )

          urls = []
          for link in links:
              urls.append(urllib.parse.urljoin(INDEX, link))

          urls = list(dict.fromkeys(urls))

          # Estado de alertas ya enviadas
          try:
              with open(STATE_FILE, "r", encoding="utf-8") as f:
                  seen = set(json.load(f))
          except:
              seen = set()

          now = datetime.now(timezone.utc)
          new_seen = set(seen)
          sent = 0

          for url in urls:
              try:
                  data = get(url)
                  root = ET.fromstring(data)

                  identifier = tag(root, "identifier")
                  status = tag(root, "status")
                  msg_type = tag(root, "msgType")

                  if not identifier:
                      continue

                  if status not in ("Actual", "Test"):
                      continue

                  # Buscar todos los polígonos del CAP
                  polygons = all_tags(root, "polygon")

                  matches = False

                  for poly in polygons:
                      pts = []

                      for pair in poly.split():
                          try:
                              a, b = pair.split(",")
                              pts.append((float(a), float(b)))
                          except:
                              pass

                      if len(pts) >= 3 and inside_polygon(LAT, LON, pts):
                          matches = True
                          break

                  if not matches:
                      continue

                  expires = tag(root, "expires")
                  expires_dt = parse_time(expires)

                  # No enviar alertas vencidas
                  if msg_type != "Cancel" and expires_dt and expires_dt < now:
                      continue

                  if identifier in seen:
                      continue

                  event = tag(root, "event")
                  severity = tag(root, "severity")
                  urgency = tag(root, "urgency")
                  onset = tag(root, "onset")
                  description = tag(root, "description")

                  title = f"SMN | {event or 'Alerta meteorológica'}"

                  message = (
                      f"RÍO TERCERO\n\n"
                      f"Evento: {event or 'No especificado'}\n"
                      f"Severidad: {severity or 'No especificada'}\n"
                      f"Urgencia: {urgency or 'No especificada'}\n"
                      f"Inicio: {onset or 'No especificado'}\n"
                      f"Vencimiento: {expires or 'No especificado'}\n\n"
                      f"{description.strip()}"
                  )

                  if msg_type == "Cancel":
                      title = f"SMN | CANCELACIÓN | {event or 'Alerta'}"

                  req = urllib.request.Request(
                      f"https://ntfy.sh/{TOPIC}",
                      data=message.encode("utf-8"),
                      method="POST",
                      headers={
                          "Title": title,
                          "Priority": "high",
                          "Tags": "warning",
                          "Click": "https://www.smn.gob.ar/alertas"
                      }
                  )

                  with urllib.request.urlopen(req, timeout=30) as r:
                      r.read()

                  new_seen.add(identifier)
                  sent += 1

                  print(f"ALERTA ENVIADA: {identifier}")

              except Exception as e:
                  print(f"Error procesando {url}: {e}")

          # Guardar estado
          os.makedirs(".github", exist_ok=True)

          # Mantener solamente los últimos 300 identificadores
          ordered = list(new_seen)[-300:]

          with open(STATE_FILE, "w", encoding="utf-8") as f:
              json.dump(ordered, f, ensure_ascii=False, indent=2)

          print(f"Alertas nuevas enviadas: {sent}")
          PY

      - name: Guardar estado de alertas
        run: |
          git config user.name "METEO RT3"
          git config user.email "meteo-rt3@users.noreply.github.com"
          git add .github/smn-seen.json
          git diff --cached --quiet || git commit -m "Actualiza estado de alertas SMN"
          git push
